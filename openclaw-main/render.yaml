services:
  - type: web
    name: openclaw
    runtime: node
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CHAT_PROJECT_ID
        sync: false
      - key: GOOGLE_CHAT_AUDIENCE_TYPE
        value: project-number
      - key: GOOGLE_CHAT_AUDIENCE
        sync: false
      - key: GOOGLE_CHAT_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CHAT_SPACE_ALLOWLIST
        sync: false
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start -- gateway --port $PORT